name: easystep_kids
description: Learn alphabets, numbers, and words in 20 languages. EasyStep Kids helps children practice handwriting through interactive tracing.
publish_to: 'none'

# pubspec.yaml
version: 1.0.0+5      # name+buildNumber; buildNumber must increase every upload

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  in_app_purchase: ^3.1.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/easystepkids.jpeg"
  adaptive_icon_background: "#FFD966"
  adaptive_icon_foreground: "assets/easystepkids.jpeg"

  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/easystepkids.jpeg